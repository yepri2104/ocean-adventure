<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ocean Adventure</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ================= START SCREEN ================= -->

<div id="startScreen">

  <div class="menu-box">

    <h1 id="gameTitle">🌊 Ocean Adventure</h1>

    <button onclick="playButtonSound(); startGame()">
      ▶ PLAY
    </button>

    <button onclick="playButtonSound(); openSettings()">
      ⚙ SETTINGS
    </button>

    <p class="howToPlay">
      Use the Arrow Keys to explore the ocean, collect Coins & Diamonds, and survive dangerous Jellyfish & Sharks.<br>
      Press ESC anytime to pause the adventure.
</p>

  </div>

</div>

<!-- ================= SETTINGS ================= -->

<div id="settingsPanel" class="panel hidden">

  <h2>⚙ SETTINGS</h2>

  <br>

  <p>Background Music</p>

  <br>

  <input
    type="range"
    min="0"
    max="1"
    step="0.05"
    value="0.5"
    oninput="setMusicVolume(this.value)"
  >

  <br><br>

  <p>Sound Effect</p>

  <br>

  <input
    type="range"
    min="0"
    max="1"
    step="0.05"
    value="0.7"
    oninput="setEffectVolume(this.value)"
  >

  <br><br>

  <button onclick="closeSettings()">
    CLOSE
  </button>

</div>

<!-- ================= PAUSE MENU ================= -->

<div id="pauseMenu" class="panel hidden">

  <h2>⏸ GAME PAUSED</h2>

  <button onclick="togglePause()">
    ▶ RESUME
  </button>

  <button onclick="restartGame()">
    🔄 RESTART
  </button>

  <button onclick="backToMenu()">
    ❌ EXIT
  </button>

</div>

<!-- ================= GAME OVER ================= -->

<div id="gameOverScreen">

  <h1>GAME OVER</h1>

  <h2 id="finalScore">
    Final Score : 0
  </h2>

  <button onclick="restartGame()">
    RESTART
  </button>

</div>

<!-- ================= AUDIO ================= -->

<audio id="bgMusic" loop>
  <source src="assets/bgmusic.mp3" type="audio/mpeg">
</audio>
<audio id="menuMusic" loop>
  <source src="assets/bgmusic.mp3" type="audio/mpeg">
</audio>

<audio id="buttonSound">
  <source src="assets/click.mp3" type="audio/mpeg">
</audio>
<!-- ================= UI ================= -->

<div id="ui">

  <div class="ui-box">
    ❤️ HP:
    <span id="hp">100</span>
  </div>

  <div class="ui-box">
    💰 Score:
    <span id="score">0</span>
  </div>

</div>

<!-- ================= PAUSE BUTTON ================= -->

<button id="pauseBtn" onclick="togglePause()">
  ⏸
</button>

<!-- ================= CANVAS ================= -->

<canvas id="gameCanvas"></canvas>

<!-- ================= SCRIPT ================= -->

<!-- ================= MOBILE CONTROL ================= -->

<div id="mobileControls">

  <button id="upBtn">⬆</button>

  <div class="middleControls">

    <button id="leftBtn">⬅</button>

    <button id="rightBtn">➡</button>

  </div>

  <button id="downBtn">⬇</button>

</div>

<script src="script.js"></script>

</body>
</html>
